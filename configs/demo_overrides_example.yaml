# move_speed: 0.1          # distance a dot moves per step
# dispersal_sd: 2.0        # how far from its parent a child is born
# interaction_radius: 4.0  # how close a neighbour must be to be met
# share_benefit: 0.9       # share of the giver's energy that reaches the recipient
# max_age: 300             # death by old age
# init_agents: 2500        # starting population
