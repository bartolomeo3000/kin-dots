# Example of your own changes to the self-sacrifice demo. Copy this file, uncomment and
# edit what you want, then run:   ./demo.sh --set-file my_world.yaml
# Every line applies to BOTH worlds, so they still differ only in who receives the gift.
# All names, defaults and meanings: kin_dots/core/params.py
season_amplitude: 0.7      # how harsh winter is (demo: 0.9; 0 = no seasons)
